name: Update study progress

on:
  push:
    paths:
      - README.md
      - STUDY_PLAN.md
      - scripts/update-progress.ps1
      - .github/workflows/update-progress.yml

permissions:
  contents: write

concurrency:
  group: update-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate progress bar
        shell: pwsh
        run: ./scripts/update-progress.ps1

      - name: Commit updated progress bar
        shell: bash
        run: |
          if git diff --quiet -- assets/progress.svg; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/progress.svg
          git commit -m "Update study progress"
          git push
